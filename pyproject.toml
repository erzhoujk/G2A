[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "g2a-safety"
version = "0.1.0"
description = "Guard-and-Guide runtime safety for long-horizon LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "J. K. Zhou" }]
keywords = ["llm-agents", "runtime-safety", "guardrails", "safety-skills"]
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.1", "transformers>=4.45"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
g2a-demo = "g2a.cli:main"
g2a-train-guard = "g2a.train_guard:main"
g2a-build-tcsd = "g2a.build_tcsd:main"

[tool.hatch.build.targets.wheel]
packages = ["src/g2a"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
